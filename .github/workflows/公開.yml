# ゲームを GitHub Pages に置く。
#
# ゲームはブラウザの中だけで動くので、置くのは public/ の中身だけでよい。
# サーバーは要らない。アカウントも課金も要らない。
#
# 置き場所は https://<ユーザー名>.github.io/<リポジトリ名>/ になる。
# 根ではないので、public/ の中のパスはすべて相対で書いてある。
#
# 【最初の1回だけ必要な設定】
#   GitHubのリポジトリ → Settings → Pages → Build and deployment
#   Source を「GitHub Actions」に変える。
#   これを変えるまで、このワークフローは最後の一歩で失敗する。

name: 公開

on:
  push:
    branches: [main]
  # 取りこぼしを拾うための見回り。
  #
  # push だけに頼れない事情がある：GitHubアプリのトークンでマージすると、
  # その push ではワークフローが起動しない。実際にそれで公開が止まり、
  # 気づかないまま古い版が残ったことがある。
  # マージの仕方に関係なく届くよう、定期的に「公開済みと違うか」を見る。
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '変更が無くても公開しなおす'
        type: boolean
        default: false

# Pagesへ書き込むために要る権限。
# deployments: read は「前回何を公開したか」を聞くために要る。
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# 公開は1つずつ。走っている途中のものは止めない（中途半端な状態で終わらせないため）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ジョブIDとステップIDは英数字にする。
  # ${{ steps.X.outputs.Y }} のような式が日本語の識別子を解釈できないため。
  # 画面に出るのは name: のほうなので、そちらは日本語のままでよい。
  #
  # シェルの変数名も英数字にする。bash は非ASCIIの変数名を受け付けない。
  check:
    name: 公開が要るか見る
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.judge.outputs.needed }}
    steps:
      - id: judge
        name: 公開済みのものと見比べる
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          current='${{ github.sha }}'
          # 前回この環境へ実際に公開されたコミット。記録が無ければ空になる。
          deployed="$(gh api \
            'repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1' \
            --jq '.[0].sha // ""' 2>/dev/null || echo '')"

          echo "main の先頭 : $current"
          echo "公開済み    : ${deployed:-（記録なし）}"

          if [ "${FORCE:-false}" = 'true' ]; then
            echo '→ 手で指定されたので公開します'
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$deployed" ]; then
            echo '→ 公開の記録が無いので公開します'
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$deployed" ]; then
            echo '→ 変わっていないので何もしません'
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo '→ 変わっているので公開します'
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 組み立て
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: 壊れていないか確かめてから公開する
        run: |
          npm run build
          node --test "dist/**/*.test.js"

      - name: ブラウザ用にまとめる
        run: npm run build:browser

      - name: 置くものを整える
        run: |
          rm -rf 公開物
          cp -r public 公開物
          # ユーザーが手元で作った配置データは公開しない
          rm -f 公開物/レイアウト.json 公開物/レイアウト.json.bak 公開物/レイアウト.json.tmp
          # GitHub Pages が _ 始まりのファイルを消さないようにする
          touch 公開物/.nojekyll
          ls -la 公開物

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 公開物

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        name: Pagesへ置く
        uses: actions/deploy-pages@v4
