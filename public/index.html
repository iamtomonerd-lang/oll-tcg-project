<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バトルスピリッツ・スタン</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>

  <!-- デッキ選択 -->
  <section id="deckScreen" class="overlay-screen">
    <div class="mode-card">
      <p class="eyebrow">デッキを選んでください</p>
      <h1>バトルスピリッツ・スタン</h1>
      <p class="mode-lead">使用するデッキを選んでください。</p>
      <div class="mode-choices">
        <button class="mode-btn deck-btn" data-deck="gungata">
          <span class="mode-btn-title">グン＝ガタ</span>
          <span class="mode-btn-desc">赤色のスピリット（BP5000→8000）</span>
        </button>
        <button class="mode-btn deck-btn" data-deck="genbo">
          <span class="mode-btn-title">ゲン＝ボー</span>
          <span class="mode-btn-desc">赤色のスピリット（BP3000→5000）</span>
        </button>
        <button class="mode-btn deck-btn" data-deck="mushaako">
          <span class="mode-btn-title">ムーシャッコ</span>
          <span class="mode-btn-desc">赤色のスピリット（BP2000→3000）、ドロー効果</span>
        </button>
      </div>
    </div>
  </section>

  <!-- モード選択 -->
  <section id="modeScreen" class="overlay-screen" hidden>
    <div class="mode-card">
      <p class="eyebrow" id="modeEyebrow">―</p>
      <h1>対戦相手を選んでください</h1>
      <p class="mode-lead"></p>
      <div class="mode-choices">
        <button class="mode-btn" data-mode="vsAI">
          <span class="mode-btn-title">練習用AIと対戦</span>
          <span class="mode-btn-desc">1画面で完結。相手は自動で行動します。</span>
        </button>
        <button class="mode-btn" data-mode="vsHuman">
          <span class="mode-btn-title">2人で対戦（同じ画面）</span>
          <span class="mode-btn-desc">手番が変わるたびに画面を渡し合います。</span>
        </button>
      </div>
      <button id="deckBack" class="btn-outline" style="margin-top: 16px;">← デッキを変更</button>
    </div>
  </section>

  <!-- 手番の受け渡し -->
  <section id="handoffScreen" class="overlay-screen" hidden>
    <div class="mode-card">
      <p class="eyebrow">画面を渡してください</p>
      <h1 id="handoffName">―</h1>
      <p class="mode-lead" id="handoffReason">の番です</p>
      <button id="handoffReady" class="mode-btn mode-btn-solo">
        <span class="mode-btn-title">準備できました</span>
      </button>
    </div>
  </section>

  <!-- 決着 -->
  <section id="resultScreen" class="overlay-screen" hidden>
    <div class="mode-card">
      <p class="eyebrow" id="resultEyebrow">決着</p>
      <h1 id="resultHeadline">―</h1>
      <p class="mode-lead" id="resultReason"></p>
      <button id="resultRestart" class="mode-btn mode-btn-solo">
        <span class="mode-btn-title">もう一度</span>
      </button>
    </div>
  </section>

  <!-- 盤面 -->
  <main id="board" class="board" hidden>

    <!-- 相手エリア -->
    <section class="side side-foe">
      <div class="side-bar">
        <div class="identity">
          <span class="identity-name" id="foeName">相手</span>
          <span class="life" id="foeLife">Life 0</span>
        </div>
        <div class="resources">
          <div class="pips" id="foePips" title="リザーブ"></div>
          <button class="zone-count" id="foeDeck" type="button">デッキ 0</button>
          <button class="zone-count" id="foeTrash" type="button">トラッシュ 0</button>
        </div>
      </div>
      <div class="hand hand-foe" id="foeHand"></div>
      <div class="field" id="foeField"></div>
    </section>

    <!-- ターン表示 -->
    <div class="turn-banner" id="turnBanner">
      <span id="turnLabel">―</span>
      <button id="endStepBtn" class="btn-ghost" hidden>ステップを終了</button>
    </div>

    <!-- 自分エリア -->
    <section class="side side-self">
      <div class="field" id="selfField"></div>
      <div class="side-bar">
        <div class="identity">
          <span class="identity-name" id="selfName">自分</span>
          <span class="life" id="selfLife">Life 0</span>
        </div>
        <div class="resources">
          <div class="pips" id="selfPips" title="リザーブ"></div>
          <button class="zone-count" id="selfDeck" type="button">デッキ 0</button>
          <button class="zone-count" id="selfTrash" type="button">トラッシュ 0</button>
        </div>
      </div>
      <div class="hand" id="selfHand"></div>
    </section>
  </main>

  <!-- コア移動パネル -->
  <div id="coreMovePanel" class="popover" hidden>
    <p class="popover-title" id="coreMoveTitle">コアを移動</p>
    <p class="popover-hint" id="coreMoveHint"></p>
    <div class="popover-row">
      <button id="coreMoveMinus" class="stepper-btn" type="button">−</button>
      <span id="coreMoveAmount" class="stepper-value">1</span>
      <button id="coreMovePlus" class="stepper-btn" type="button">＋</button>
    </div>
    <div class="popover-actions">
      <button id="coreMoveToCard" class="btn-solid" type="button">リザーブから乗せる</button>
      <button id="coreMoveToReserve" class="btn-outline" type="button">リザーブへ戻す</button>
      <button id="coreMoveSoulBtn" class="btn-outline" type="button" hidden>ソウルコアをリザーブへ</button>
      <button id="coreMoveFromReserveSoulBtn" class="btn-solid" type="button" hidden>リザーブからソウルコアを乗せる</button>
    </div>
    <button id="coreMoveClose" class="popover-close" type="button">閉じる</button>
  </div>

  <!-- トラッシュ一覧 -->
  <div id="trashPanel" class="popover" hidden>
    <p class="popover-title" id="trashTitle">トラッシュ</p>
    <div class="trash-list" id="trashList"></div>
    <button id="trashClose" class="popover-close" type="button">閉じる</button>
  </div>

  <!-- カード効果情報 -->
  <div id="cardEffectPanel" class="popover" hidden>
    <p class="popover-title" id="cardEffectName">―</p>
    <p class="card-effect-text" id="cardEffectText"></p>
    <button id="cardEffectClose" class="popover-close" type="button">閉じる</button>
  </div>

  <!-- カード拡大表示 -->
  <div id="cardDetailPanel" class="popover popover-card-detail" hidden>
    <div class="card-detail-content" id="cardDetailContent"></div>
    <button id="cardDetailClose" class="popover-close" type="button">閉じる</button>
  </div>

  <!-- ブロック判断 -->
  <div id="blockPanel" class="popover popover-block" hidden>
    <p class="popover-title">ブロックしますか？</p>
    <div class="block-attacker" id="blockAttacker"></div>
    <p class="popover-hint">ブロックするスピリットを選ぶか、ブロックしないを選んでください。</p>
    <div class="field field-compact" id="blockCandidates"></div>
    <button id="blockSkip" class="btn-outline" type="button">ブロックしない</button>
  </div>

  <!-- 起動効果の発動 -->
  <div id="activatePanel" class="popover popover-activate" hidden>
    <p class="popover-title">使える効果</p>
    <p class="popover-hint">撃ちたい効果を選んでください（撃たなくてもかまいません）</p>
    <div id="activateList" class="effect-target-list"></div>
  </div>

  <!-- 効果の対象選択 -->
  <div id="effectPanel" class="popover" hidden>
    <p class="popover-title" id="effectTitle">効果</p>
    <p class="popover-hint" id="effectHint">対象を選んでください</p>
    <div id="effectTargetList" class="effect-target-list"></div>
    <div class="popover-actions">
      <button id="effectConfirm" class="btn-solid" type="button" hidden>決定</button>
      <button id="effectSkip" class="btn-outline" type="button" hidden>選ばない</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="game.js"></script>
</body>
</html>
